name: QuitSmokingMoment
options:
  bundleIdPrefix: com.jieke
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  QuitSmokingMoment:
    type: application
    platform: iOS
    sources:
      - path: JieKe
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quitsmokingmoment.app
        PRODUCT_NAME: QuitSmokingMoment
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 戒刻
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用 Face ID 解锁你的戒烟记录
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于为戒烟记录添加语音备注
        INFOPLIST_KEY_NSHealthShareUsageDescription: 用于读取步数、心率和睡眠，帮助你观察戒烟期间的生活状态
        CODE_SIGN_ENTITLEMENTS: JieKe/QuitSmokingMoment.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
    dependencies:
      - target: QuitSmokingMomentWidget
        embed: true
  QuitSmokingMomentWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quitsmokingmoment.app.widget
        PRODUCT_NAME: QuitSmokingMomentWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 戒刻小组件
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).QuitSmokingMomentWidgetBundle
        CODE_SIGN_ENTITLEMENTS: Widget/QuitSmokingMomentWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
