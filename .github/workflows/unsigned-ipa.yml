name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project QuitSmokingMoment.xcodeproj \
            -scheme QuitSmokingMoment \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload QuitSmokingMoment-unsigned.ipa

      - name: Ad-hoc sign for jailbroken devices
        run: |
          APP_PATH="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          # Sign embedded extensions first, then the containing app.  Preserve
          # the App Group entitlement in both targets so WidgetKit can open the
          # same shared UserDefaults container as the app.
          if [ -d "$APP_PATH/PlugIns" ]; then
            while IFS= read -r -d '' EXTENSION_PATH; do
              codesign --force --sign - --entitlements Widget/QuitSmokingMomentWidget.entitlements "$EXTENSION_PATH"
            done < <(find "$APP_PATH/PlugIns" -name '*.appex' -type d -print0)
          fi
          codesign --force --sign - --entitlements JieKe/QuitSmokingMoment.entitlements "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Package jailbreak-compatible IPA
        run: |
          APP_PATH="$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload QuitSmokingMoment-jailbreak.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuitSmokingMoment-unsigned-ipa
          path: QuitSmokingMoment-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload jailbreak-compatible IPA
        uses: actions/upload-artifact@v4
        with:
          name: QuitSmokingMoment-jailbreak-ipa
          path: QuitSmokingMoment-jailbreak.ipa
          if-no-files-found: error
          retention-days: 30
